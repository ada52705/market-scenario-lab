name: 检查并发布工作台
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: 检查账户执行规则
        run: python scripts/test_account.py
      - name: 核对320组账户参考结果
        run: python scripts/check_snapshot.py
      - name: 检查滚动窗口边界与执行规则
        run: python scripts/test_rolling.py
      - name: 核对1600组滚动窗口参考结果
        run: python scripts/backtest_rolling.py
      - name: 检查四档日历持有期与原始数据不变
        run: python scripts/test_holding.py
      - name: 检查持仓浮动估值与整体盈亏拆分
        run: python scripts/test_unrealized.py
      - name: 生成网站
        run: python scripts/build_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 发布到GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
